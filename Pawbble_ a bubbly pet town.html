<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Pawbble: a bubbly pet town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#3d2b63;--muted:#7a6a9a;--panel:rgba(255,251,253,.95);--solid:#fffbfd;--line:rgba(61,43,99,.14);--chip:#f3ecff;--pink:#ff8fc7;--pinkD:#e2569c;--mint:#6fe3bd;--mintD:#3fb48f;--sky:#8fd3ff;--lemon:#ffdf6e;--grape:#8b6cff;--shadow:0 5px 0 rgba(61,43,99,.16);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f4edff;--muted:#b9acd9;--panel:rgba(40,29,68,.95);--solid:#281d44;--line:rgba(255,255,255,.15);--chip:#3a2c61;--shadow:0 5px 0 rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f4edff;--muted:#b9acd9;--panel:rgba(40,29,68,.95);--solid:#281d44;--line:rgba(255,255,255,.15);--chip:#3a2c61;--shadow:0 5px 0 rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;overflow:hidden;background:#9fdcff;font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
*,*::before,*::after{box-sizing:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.btn{font-weight:600;font-size:17px;border:0;border-radius:999px;padding:12px 22px;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pinkD);cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pinkD)}
.btn.mint{background:var(--mint);color:#1d4a3c;box-shadow:0 5px 0 var(--mintD)}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.big{font-size:20px;padding:15px 30px}
.btn.sm{font-size:15px;padding:8px 14px;box-shadow:0 4px 0 var(--pinkD)}
.btn.sm.ghost{box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn small{display:block;font-size:13px;font-weight:500;opacity:.9;margin-top:2px}
.screen{position:fixed;inset:0;display:none;z-index:20}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;flex-direction:column}
#loading{background:linear-gradient(#9fdcff,#ffd6ec);gap:14px;font-weight:600;font-size:18px;color:#3d2b63}
.loadbub{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0 10%,transparent 12%),radial-gradient(circle,rgba(255,255,255,.1) 55%,rgba(255,143,199,.55) 70%,rgba(143,211,255,.7) 85%,rgba(255,255,255,.9));animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) scale(1.05)}}
#menu{gap:10px;padding:24px;text-align:center;pointer-events:none}
#menu>*{pointer-events:auto}
.logo{margin:0;font-size:clamp(64px,17vw,124px);font-weight:700;line-height:.9;color:#fff;letter-spacing:-.01em;display:flex;justify-content:center}
.logo span{display:inline-block;text-shadow:0 7px 0 #ff7cbc,0 14px 22px rgba(61,43,99,.25);animation:float 3s ease-in-out infinite}
.logo span:nth-child(2n){animation-delay:-1s;text-shadow:0 7px 0 #8b6cff,0 14px 22px rgba(61,43,99,.25)}
.logo span:nth-child(3n){animation-delay:-2s;text-shadow:0 7px 0 #45c99f,0 14px 22px rgba(61,43,99,.25)}
@keyframes float{50%{transform:translateY(-8px)}}
.tag{margin:6px 0 18px;font-size:19px;font-weight:500;color:#fff;text-shadow:0 2px 8px rgba(61,43,99,.45)}
.mbtns{display:flex;flex-direction:column;gap:14px;width:min(320px,86vw)}
.mbtns .btn{width:100%}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:10}
#hud.on{display:block}
.top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tl{display:flex;gap:8px;flex-wrap:wrap}
.pill{pointer-events:auto;background:var(--panel);border:0;border-radius:999px;padding:7px 14px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:7px;font-size:16px;color:var(--ink)}
.pill.icon{width:44px;height:44px;padding:0;justify-content:center;cursor:pointer}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 14%,transparent 16%),radial-gradient(circle,#ffd84a 0 46%,#f2a81d 47% 56%,rgba(255,255,255,.35) 58%,rgba(143,211,255,.8) 82%,#fff);display:inline-block;transition:transform .2s}
.coin.bump{transform:scale(1.35)}
#needs{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
#petTabs{display:flex;gap:6px}
.ptab{pointer-events:auto;border:0;background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:600;font-size:15px;box-shadow:var(--shadow);cursor:pointer}
.ptab.on{background:var(--grape);color:#fff}
.needrow{display:flex;gap:8px}
.need{width:44px;height:44px;border-radius:50%;position:relative;overflow:hidden;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 4px 0 rgba(61,43,99,.16)}
.need .fill{position:absolute;left:-15%;right:-15%;bottom:0;height:50%;background:var(--c);border-radius:46% 42% 0 0;transition:height .5s;animation:slosh 2.4s ease-in-out infinite}
@keyframes slosh{50%{transform:translateX(6%) rotate(-3deg)}}
.need .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.need::after{content:"";position:absolute;left:20%;top:13%;width:26%;height:17%;border-radius:50%;background:rgba(255,255,255,.8);transform:rotate(-30deg)}
.need.low{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.br{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.brrow{display:flex;gap:10px;align-items:flex-end}
.bub{pointer-events:auto;width:78px;height:78px;border-radius:50%;border:0;font-weight:700;font-size:15px;color:#fff;cursor:pointer;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.75) 0 10%,transparent 12%),linear-gradient(160deg,#ffb3dc,#ff7cbc);box-shadow:0 6px 0 #d9549a;display:grid;place-items:center}
.bub:active{transform:translateY(3px);box-shadow:0 3px 0 #d9549a}
.bub.sm{width:60px;height:60px;font-size:12px;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.75) 0 10%,transparent 12%),linear-gradient(160deg,#c6b5ff,#8b6cff);box-shadow:0 5px 0 #6a4fd6}
.act{display:none;background:var(--mint);color:#1d4a3c;box-shadow:0 5px 0 var(--mintD);font-size:17px;padding:11px 18px;cursor:pointer}
.act.on{display:flex}
.tray{display:none;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:min(92vw,420px)}
.tray.on{display:flex}
.tb{border:0;width:64px;height:72px;border-radius:24px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.tb span{font-size:26px;line-height:1}
.tb:active{transform:translateY(2px)}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 3px rgba(255,255,255,.75);display:none}
#joy.on{display:block}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 14%,transparent 16%),linear-gradient(160deg,#ffd0ea,#ff8fc7);box-shadow:0 4px 0 #d9549a}
.hint{position:absolute;left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--panel);border-radius:18px;padding:8px 12px;font-size:14px;color:var(--muted);box-shadow:var(--shadow);max-width:250px}
#hud.dec #needs,#hud.dec .br,#hud.dec .hint{display:none}
#decbar{position:fixed;left:0;right:0;bottom:0;display:none;z-index:12;flex-direction:column;align-items:center;gap:10px;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none}
#decbar.on{display:flex}
#decbar>*{pointer-events:auto}
.dmsg{background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;box-shadow:var(--shadow);text-align:center}
.drow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 158px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:40;width:max-content;max-width:92vw}
.toast{background:var(--panel);padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:600;font-size:15px;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.95)}}
.sheet-wrap{position:fixed;inset:0;z-index:30;background:rgba(40,25,70,.25);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(580px,100%);max-height:82%;background:var(--panel);border-radius:28px 28px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(40,25,70,.2);animation:up .22s ease-out;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh-h h3{margin:0;font-size:22px;font-weight:700}
.x{border:0;width:40px;height:40px;border-radius:50%;background:var(--chip);font-size:18px;cursor:pointer;flex:none}
.scroll{overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-b{display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.lead{margin:0;color:var(--muted);font-size:16px;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.card{background:var(--chip);border-radius:22px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.c-ic{font-size:34px;line-height:1.1}
.c-n{font-weight:600;font-size:16px}
.c-d,.c-o{font-size:13px;color:var(--muted)}
.card .btn{margin-top:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.petrow{background:var(--chip);border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.petrow b{font-size:18px}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.bar i{display:block;height:100%;background:var(--mint);border-radius:999px}
.chips,.sws{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;font-weight:500;font-size:15px;padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--ink);cursor:pointer}
.chip.on{background:var(--grape);color:#fff}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--grape)}
.swc{width:34px;height:34px;border-radius:50%;border:0;padding:0;background:conic-gradient(#ff8fc7,#ffdf6e,#6fe3bd,#8fd3ff,#8b6cff,#ff8fc7);cursor:pointer}
.swc::-webkit-color-swatch-wrapper{padding:0}
.swc::-webkit-color-swatch{border:3px solid #fff;border-radius:50%;opacity:0}
.field{display:flex;flex-direction:column;gap:7px}
.f-l{font-weight:600;font-size:15px;color:var(--muted)}
.tin{font:inherit;font-size:18px;padding:11px 16px;border-radius:16px;border:2px solid var(--line);background:var(--solid);color:var(--ink);width:100%;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;accent-color:var(--pink)}
.rl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
#creator{pointer-events:none}
.cpanel{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;height:58%;background:var(--panel);border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(40,25,70,.2)}
@media (min-width:820px) and (orientation:landscape){.cpanel{left:auto;top:0;height:auto;width:420px;border-radius:28px 0 0 28px;padding-top:env(safe-area-inset-top,0px)}}
.c-head{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.c-head h2{margin:0;font-size:22px}
.c-body{flex:1;padding:6px 16px 10px;display:flex;flex-direction:column;gap:14px}
.c-foot{padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center}
.c-foot .btn{width:min(340px,100%)}
.presets{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;touch-action:pan-x}
.preset{flex:none;border:0;border-radius:20px;background:var(--chip);padding:10px 14px;text-align:left;cursor:pointer;color:var(--ink)}
.preset b{display:block;font-size:17px}
.preset small{color:var(--muted);font-size:13px}
.preset.on{background:var(--grape);color:#fff}
.preset.on small{color:#efe8ff}
#pause{background:rgba(40,25,70,.35);align-items:center;justify-content:center}
.pcard{background:var(--panel);border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:12px;width:min(340px,90vw);box-shadow:0 10px 40px rgba(40,25,70,.3)}
.pcard h2{margin:0 0 4px;text-align:center;font-size:28px}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{background:var(--chip);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:4px}
.slot .sl-t{font-weight:700;font-size:19px}
.slot .sl-s{color:var(--muted);font-size:14px}
.slot .row{margin-top:8px}
#fade{position:fixed;inset:0;background:#fff4fb;opacity:0;pointer-events:none;transition:opacity .25s;z-index:35}
#fade.on{opacity:1}
.help p{margin:0;line-height:1.45}
.help b{color:var(--grape)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:420px){.need{width:40px;height:40px}.need .ic{font-size:18px}.bub{width:70px;height:70px}.tb{width:58px;height:66px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Pawbble town"></canvas>
<div id="loading" class="screen center on"><div class="loadbub"></div><div id="loadMsg">Blowing bubbles…</div></div>
<div id="menu" class="screen center">
  <h1 class="logo" aria-label="Pawbble"><span>P</span><span>a</span><span>w</span><span>b</span><span>b</span><span>l</span><span>e</span></h1>
  <p class="tag">Raise a bubbly pet in a tiny pastel town</p>
  <div class="mbtns">
    <button class="btn big" id="mContinue">Continue<small></small></button>
    <button class="btn mint big" id="mNew">New game</button>
    <button class="btn ghost" id="mLoad">Load game</button>
    <button class="btn ghost" id="mSettings">Settings</button>
  </div>
</div>
<div id="creator" class="screen"></div>
<div id="pause" class="screen"></div>
<div id="hud">
  <div class="top">
    <div class="tl"><div class="pill"><i class="coin" id="coinIc"></i><b id="coinN">0</b></div><div class="pill" id="hDay">Day 1</div></div>
    <button class="pill icon" id="hPause" aria-label="Pause"><svg width="16" height="18" viewBox="0 0 16 18"><rect x="1" y="1" width="5" height="16" rx="2.5" fill="currentColor"/><rect x="10" y="1" width="5" height="16" rx="2.5" fill="currentColor"/></svg></button>
  </div>
  <div id="needs"><div id="petTabs"></div><div class="needrow" id="needRow"></div></div>
  <div class="br">
    <button class="pill act" id="hAction"></button>
    <div class="tray" id="tray"></div>
    <div class="brrow"><button class="bub sm" id="hDecor">Decorate</button><button class="bub" id="hCare">Care</button></div>
  </div>
  <div class="hint" id="hint"></div>
  <div id="joy"><div id="knob"></div></div>
</div>
<div id="decbar"></div>
<div id="toasts" aria-live="polite"></div>
<div id="layer"></div>
<div id="fade"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
const clone=o=>JSON.parse(JSON.stringify(o));
function angLerp(a,b,t){const d=((b-a)%TAU+TAU*1.5)%TAU-Math.PI;return a+d*t;}
function smooth(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fmtPlay(sec){const m=Math.floor((sec||0)/60);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min';}
function ago(ts){if(!ts)return'never';const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';const d=Math.floor(s/86400);return d+(d===1?' day ago':' days ago');}
function clockStr(tod){const m=Math.floor(tod*1440),hh=Math.floor(m/60),mm=m%60;const h12=hh%12===0?12:hh%12;return h12+':'+String(mm).padStart(2,'0')+(hh<12?' am':' pm');}

const DEFAULT_SETTINGS={quality:'medium',music:0.5,sfx:0.8,sens:1,autocam:true,needs:'normal',away:true,touch:'auto'};

const Store={
  KEY:'pawbble.v1',
  data:{v:1,slots:[null,null,null],last:-1,settings:Object.assign({},DEFAULT_SETTINGS)},
  load(){try{const raw=localStorage.getItem(this.KEY);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.slots)){this.data.slots=d.slots;this.data.last=typeof d.last==='number'?d.last:-1;this.data.settings=Object.assign({},DEFAULT_SETTINGS,d.settings||{});}}}catch(e){}
    while(this.data.slots.length<3)this.data.slots.push(null);this.data.slots.length=3;},
  persist(){try{localStorage.setItem(this.KEY,JSON.stringify(this.data));}catch(e){}Cloud.push();},
};

const Cloud={db:null,uid:null,ready:false,timer:null,busy:Promise.resolve(),
  async init(){try{if(!window.claude||typeof window.claude.use!=='function')return;const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;this.db=db;this.uid=id;
      const snap=await this.ref().get();if(snap.exists){const r=snap.data();if(r&&typeof r.json==='string'){const remote=JSON.parse(r.json);this.merge(remote);}}
      this.ready=true;this.push();return true;}catch(e){console.warn('Cloud saves unavailable',e);}},
  ref(){return this.db.collection('data/users/'+this.uid).doc('pawbble');},
  merge(remote){if(!Array.isArray(remote))return;let changed=false;for(let i=0;i<3;i++){const r=remote[i],l=Store.data.slots[i];if(r&&(!l||(r.savedAt||0)>(l.savedAt||0))){Store.data.slots[i]=r;changed=true;}}
    if(changed){try{localStorage.setItem(Store.KEY,JSON.stringify(Store.data));}catch(e){}}},

  adopt(def){if(this.pets.length>=3)return;const pd=this.newPet(def);this.data.pets.push(pd);const p=this.makePet(pd);this.pets.push(p);this.sel=this.pets.length-1;this.placePets();if(def.favToy&&!this.data.inv.toys[def.favToy])this.data.inv.toys[def.favToy]=1;UI.toast('Say hi to '+def.name+'!');this.save(true);},

  findInteract(){const P=this.player,list=World.interacts[this.sid]||[];let best=null,bd=1e9;if(!this.dec)for(const it of list){const d=Math.hypot(it.x-P.x,it.z-P.z);if(d<it.r&&d<bd){bd=d;best=it;}}if(best!==this.inter){this.inter=best;UI.setAction(best);}},
  updBubbles(dt){if(this.sid!=='town')return;const actors=[this.player,...this.pets];for(const b of World.bubbles){if(b.dead){b.t-=dt;if(b.t<=0)placeBubble(b);continue;}const bx=b.m.position.x,bz=b.m.position.z;
      for(const a of actors){const dx=a.x-bx,dz=a.z-bz,rr=b.r+0.45;if(dx*dx+dz*dz<rr*rr){this.popBubble(b);break;}}}},

  tap(x,y){const ndc=new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1);Input.ray.setFromCamera(ndc,camera);if(this.dec){House_tap(Input.ray);return;}

  updCam(dt,snap){const P=this.player,C=this.cam;let tx=P.x,ty=1.0,tz=P.z,yaw,pitch,dist;
    if(this.sid==='town'){if(P.spd>0.6&&this.t-C.dragT>1.6&&Store.data.settings.autocam)C.yaw=angLerp(C.yaw,P.ry+Math.PI,1-Math.exp(-0.9*dt));yaw=C.yaw;pitch=C.pitch;dist=this.camClear(tx,ty,tz,yaw,pitch,C.dist);}
    else{const R=ROOMS[this.sid],th=Math.tan(camera.fov*Math.PI/360),asp=camera.aspect;yaw=0;if(this.dec){pitch=1.18;dist=Math.max(15.5,(R.w/2+0.8)/(th*asp),(R.d/2+1.5)/th);tx=R.ox;tz=R.oz+0.6;}else{pitch=0.85;dist=clamp(R.w*0.3/(th*asp),11,17);tx=lerp(R.ox,P.x,0.5);tz=lerp(R.oz,P.z,0.35);}}
    const cp=Math.cos(pitch),cx=tx+Math.sin(yaw)*cp*dist,cy=ty+Math.sin(pitch)*dist,cz=tz+Math.cos(yaw)*cp*dist;
    if(!C.pos||snap){C.pos=new THREE.Vector3(cx,cy,cz);C.look=new THREE.Vector3(tx,ty,tz);}else{const k=1-Math.exp(-(this.sid==='town'?10:6)*dt);C.pos.x+=(cx-C.pos.x)*k;C.pos.y+=(cy-C.pos.y)*k;C.pos.z+=(cz-C.pos.z)*k;C.look.x+=(tx-C.look.x)*k;C.look.y+=(ty-C.look.y)*k;C.look.z+=(tz-C.look.z)*k;}

  camClear(tx,ty,tz,yaw,pitch,dist){const B=World.colliders.town.boxes,cp=Math.cos(pitch);for(let s=1;s<=10;s++){const d=dist*s/10,x=tx+Math.sin(yaw)*cp*d,y=ty+Math.sin(pitch)*d,z=tz+Math.cos(yaw)*cp*d;for(const b of B){if(b.h&&y<b.h+0.3&&x>b.x0-0.3&&x<b.x1+0.3&&z>b.z0-0.3&&z<b.z1+0.3)return Math.max(1.6,d-0.8);}}return dist;}};

/* ---------- decorating ---------- */
function decValid(sel){const rid=Game.sid,R=ROOMS[rid],e=furnExt(sel);if(Math.abs(sel.x)+e[0]>R.w/2-0.05||Math.abs(sel.z)+e[1]>R.d/2-0.05)return false;if(sel.z+e[1]>R.d/2-1.5&&Math.abs(sel.x)-e[0]<1.4)return false;
  for(const [dx,dz] of(R.doors||[])){const cx=clamp(dx,sel.x-e[0],sel.x+e[0]),cz=clamp(dz,sel.z-e[1],sel.z+e[1]);if(Math.hypot(cx-dx,cz-dz)<1.15)return false;}if(FURN[sel.id].flat)return true;
  for(const it of House.room(rid).items){if(it===sel.ref||FURN[it.id].flat)continue;const f=furnExt(it);if(Math.abs(it.x-sel.x)<e[0]+f[0]-0.02&&Math.abs(it.z-sel.z)<e[1]+f[1]-0.02)return false;}
  const S=House.r[rid].sBoxes;for(const b of S){if(R.ox+sel.x+e[0]>b.x0&&R.ox+sel.x-e[0]<b.x1&&R.oz+sel.z+e[1]>b.z0&&R.oz+sel.z-e[1]<b.z1)return false;}
  for(const c of World.colliders[rid].circles){if(Math.abs(R.ox+sel.x-c.x)<e[0]+c.r&&Math.abs(R.oz+sel.z-c.z)<e[1]+c.r)return false;}return true;}
function decGhost(){const D=Game.dec;if(House.ghost){House.ghost.parent&&House.ghost.parent.remove(House.ghost);House.ghost=null;}if(!D||!D.sel)return;const g=buildFurn(D.sel.id);g.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=0.6;o.castShadow=false;}});House.r[Game.sid].items.add(g);House.ghost=g;decUpdGhost();}
function decUpdGhost(){const D=Game.dec,g=House.ghost;if(!g||!D.sel)return;g.position.set(D.sel.x,0.02,D.sel.z);g.rotation.y=D.sel.r*Math.PI/2;const ok=decValid(D.sel);D.ok=ok;g.traverse(o=>{if(o.isMesh&&o.material.emissive){o.material.emissive.set(ok?'#2fbf71':'#e0344f');o.material.emissiveIntensity=0.45;}});}
function House_tap(ray){const D=Game.dec,rid=Game.sid,R=ROOMS[rid];if(D.sel){const pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();if(ray.ray.intersectPlane(pl,hit)){D.sel.x=Math.round((hit.x-R.ox)*4)/4;D.sel.z=Math.round((hit.z-R.oz)*4)/4;decUpdGhost();UI.decBar();}return;}
  const hits=ray.intersectObjects(House.r[rid].objs,true);if(hits.length){let o=hits[0].object;while(o&&!o.userData.item)o=o.parent;if(o){const it=o.userData.item;D.sel={id:it.id,x:it.x,z:it.z,r:it.r,ref:it};House.hidden=it;o.visible=false;decGhost();UI.decBar();Sfx.click();}}}
function decStart(id){const D=Game.dec,R=ROOMS[Game.sid],P=Game.player;decCancel();D.sel={id,x:clamp(Math.round((P.x-R.ox)*2)/2,-R.w/2+1.5,R.w/2-1.5),z:clamp(Math.round((P.z-R.oz-1)*2)/2,-R.d/2+1.5,R.d/2-2.5),r:0,ref:null};decGhost();UI.decBar();}
function decRotate(){const D=Game.dec;if(!D.sel)return;D.sel.r=(D.sel.r+1)%4;decUpdGhost();Sfx.click();}
function decPlace(){const D=Game.dec,s=D.sel,rid=Game.sid;if(!s)return;if(!D.ok){UI.toast(s.z>ROOMS[rid].d/2-2.5?'Keep the doorway clear':'That spot is taken, blocks a door, or is too close to a wall');Sfx.nope();return;}
  if(s.ref){s.ref.x=s.x;s.ref.z=s.z;s.ref.r=s.r;}else House.room(rid).items.push({id:s.id,x:s.x,z:s.z,r:s.r});D.sel=null;House.hidden=null;decGhost();House.buildItems(rid);Sfx.pop();UI.decBar();collide(rid,Game.player,0.35);}
function decStore(){const D=Game.dec,s=D.sel,rid=Game.sid;if(!s)return;if(s.ref){const a=House.room(rid).items;a.splice(a.indexOf(s.ref),1);}D.sel=null;House.hidden=null;decGhost();House.buildItems(rid);UI.decBar();Sfx.click();}
function decCancel(){const D=Game.dec;if(!D)return;D.sel=null;House.hidden=null;decGhost();if(HOME_ROOMS.includes(Game.sid))House.buildItems(Game.sid);}
function furnAvail(id){const own=Game.data.inv.furn[id]||0;let placed=0;for(const r in Game.data.house.rooms)placed+=Game.data.house.rooms[r].items.filter(i=>i.id===id).length;return own-placed;}

/* ---------- input ---------- */
const Input={k:{},joy:null,drag:null,down:null,ray:null,
  init(){this.ray=new THREE.Raycaster();const cv=$('#c');addEventListener('keydown',e=>this.key(e,true));addEventListener('keyup',e=>this.key(e,false));addEventListener('blur',()=>{this.k={};});
    cv.addEventListener('pointerdown',e=>this.pd(e));cv.addEventListener('pointermove',e=>this.pm(e));cv.addEventListener('pointerup',e=>this.pu(e));cv.addEventListener('pointercancel',e=>this.pu(e));
    cv.addEventListener('wheel',e=>{if(Game.playing&&Game.sid==='town')Game.cam.dist=clamp(Game.cam.dist+e.deltaY*0.01,4,14);},{passive:true});cv.addEventListener('contextmenu',e=>e.preventDefault());},
  key(e,dn){const c=e.code,map={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',ShiftLeft:'run',ShiftRight:'run'};
    const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){if(c==='Escape'&&dn)ae.blur();return;}
    if(map[c]){this.k[map[c]]=dn;if(c.startsWith('Arrow'))e.preventDefault();return;}if(!dn)return;Sfx.resume();
    if(c==='Escape'){e.preventDefault();UI.esc();return;}if(!Game.playing||Game.paused||UI.sheetEl)return;
    if(c==='KeyE'||c==='Enter'){Game.interact();}else if(c==='Tab'){e.preventDefault();Game.nextPet();}else if(c==='Digit1')UI.openFeed();else if(c==='Digit2')UI.openPlay();else if(c==='Digit3')Game.bathe();else if(c==='Digit4')Game.sleep();else if(c==='Digit5')Game.cuddle();else if(c==='KeyC')UI.toggleTray();},
  pd(e){Sfx.resume();try{e.target.setPointerCapture(e.pointerId);}catch(_){}const x=e.clientX,y=e.clientY;this.down={id:e.pointerId,x,y,t:performance.now(),moved:0};
    if(UI.state==='creator'){this.drag={id:e.pointerId,x,y,kind:'studio'};return;}if(!Game.playing||Game.paused)return;
    if(e.pointerType!=='mouse'&&x<innerWidth*0.45&&!this.joy&&!Game.dec){this.joy={id:e.pointerId,ox:x,oy:y};UI.joy(true,x,y);return;}if(!this.drag)this.drag={id:e.pointerId,x,y,kind:'cam'};},
  pm(e){const d=this.down;if(d&&e.pointerId===d.id)d.moved=Math.max(d.moved,Math.hypot(e.clientX-d.x,e.clientY-d.y));
    if(this.joy&&e.pointerId===this.joy.id){let dx=e.clientX-this.joy.ox,dy=e.clientY-this.joy.oy;const m=Math.hypot(dx,dy),R=56;if(m>R){dx=dx/m*R;dy=dy/m*R;}Game.input.x=dx/R;Game.input.z=-dy/R;Game.input.joyRun=m>R*0.96;UI.joyKnob(dx,dy);return;}
    if(this.drag&&e.pointerId===this.drag.id){const dx=e.clientX-this.drag.x,dy=e.clientY-this.drag.y;this.drag.x=e.clientX;this.drag.y=e.clientY;const s=Store.data.settings.sens;
      if(this.drag.kind==='studio'){Studio.spin(dx);return;}if(Game.sid==='town'&&!Game.dec){Game.cam.yaw-=dx*0.006*s;Game.cam.pitch=clamp(Game.cam.pitch+dy*0.004*s,0.12,1.2);Game.cam.dragT=Game.t;}}},

  furnPicker(){const ks=Object.keys(FURN).filter(k=>furnAvail(k)>0);this.sheet('Add furniture',ks.length?this.grid(ks.map(k=>({icon:FURN[k].icon,name:FURN[k].label,owned:furnAvail(k)+' to place',btn:'Place',fn:()=>{this.closeSheet();decStart(k);}}))):h('p',{class:'lead'},'Everything you own is already out. Cozy Home sells more furniture.'));},
  outsideFields(){const H=Game.data.house,re=()=>House.buildExterior(H,Game.data.name);return[this.field('Outside walls',this.swatches(EXT_COLORS,H,'wall',re)),this.field('Roof',this.swatches(ROOF_COLORS,H,'roof',re)),this.field('Front door',this.swatches(ROOF_COLORS,H,'door',re)),

    this.sheet('Paint the '+ROOM_LABEL[rid].toLowerCase(),h('div',{class:'sh-b'},this.field('Walls in this room',this.swatches(WALL_COLORS,H,'inWall',ri)),this.field('Floor in this room',this.chips(FLOORS,H,'floor',ri)),h('p',{class:'lead'},'Outside of your house'),...this.outsideFields()),{onClose:()=>Game.save(true)});},
  paintOutside(){this.sheet('Paint my house',h('div',{class:'sh-b'},...this.outsideFields()),{onClose:()=>Game.save(true)});},

  esc(){if(this.sheetEl){this.closeSheet();return;}if(Game.dec){if(Game.dec.sel){decCancel();this.decBar();}else this.decorate(false);return;}if(this.state==='play')this.pause();else if(this.state==='pause')this.resume();},
  pause(){if(this.state!=='play')return;Game.paused=true;this.state='pause';this.closeSheet(true);Game.input.x=Game.input.z=0;Input.joy=null;this.joy(false);
    $('#pause').replaceChildren(h('div',{class:'pcard',role:'dialog','aria-label':'Paused'},h('h2',null,'Paused'),h('button',{class:'btn big',onclick:()=>this.resume()},'Resume'),h('button',{class:'btn mint',onclick:()=>{Game.save();Sfx.coin();}},'Save game'),h('button',{class:'btn ghost',onclick:()=>this.settings()},'Settings'),h('button',{class:'btn ghost',onclick:()=>this.help()},'How to play'),h('button',{class:'btn ghost',onclick:()=>this.quit()},'Save and quit to menu')));this.show('pause');},

    h('p',null,'Walk around town and pop floating bubbles for coins. Golden ones are worth 15.'),h('p',null,h('b',null,'Pet Mart'),' sells food, toys and adoptions. ',h('b',null,'Paws Clinic'),' heals sick pets. ',h('b',null,'Bubble Spa'),' does baths and new looks. ',h('b',null,'Cozy Home'),' sells furniture and home styles.'),

let renderer,camera,clock;
function applyQuality(){if(!renderer)return;const q=Store.data.settings.quality,dpr=window.devicePixelRatio||1;renderer.setPixelRatio(q==='low'?1:q==='medium'?Math.min(dpr,1.5):Math.min(dpr,2));
  const sh=q!=='low';if(renderer.shadowMap.enabled!==sh){renderer.shadowMap.enabled=sh;World.scene.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);}});}
  if(World.sun){const s=q==='high'?2048:1024;if(World.sun.shadow.mapSize.x!==s){World.sun.shadow.mapSize.set(s,s);if(World.sun.shadow.map){World.sun.shadow.map.dispose();World.sun.shadow.map=null;}}}onResize();}
function onResize(){if(!renderer)return;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
async function boot(){
  Store.load();initGeo();
  try{renderer=new THREE.WebGLRenderer({canvas:$('#c'),antialias:Store.data.settings.quality!=='low',powerPreference:'high-performance'});}catch(e){$('#loadMsg').textContent='This browser couldn’t start 3D graphics. Try another browser or device.';return;}
  renderer.shadowMap.enabled=Store.data.settings.quality!=='low';renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,230);World.scene=new THREE.Scene();clock=new THREE.Clock();
  try{if(document.fonts&&document.fonts.load)await Promise.race([document.fonts.load('600 40px Fredoka'),new Promise(r=>setTimeout(r,2200))]);}catch(e){}
  buildSky();buildTown();buildRooms();Studio.init();spawnBubbles();spawnNPCs();
  UI.init();Input.init();applyQuality();addEventListener('resize',onResize);
  Cloud.init().then(ok=>{if(ok&&UI.state==='menu')UI.refreshMenu();});
  Game.setScene('town');UI.menu();loop();}
let menuT=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),0.05);
  if(UI.state==='creator'){worldUpdate(dt);Studio.update(dt,camera);World.sky.position.copy(camera.position);updateSky(0.4,true);}
  else if(Game.playing){if(!Game.paused)Game.update(dt);worldUpdate(Game.paused?0:dt);World.sky.position.copy(camera.position);updateSky(Game.data.tod,Game.sid!=='town');Sfx.music(dt,Game.sid==='town'&&(Game.data.tod<0.25||Game.data.tod>0.8));}
  else{menuT+=dt;worldUpdate(dt);const a=menuT*0.05;camera.position.set(Math.cos(a)*34,15,Math.sin(a)*34);camera.lookAt(0,2,0);followSun(0,0);World.sky.position.copy(camera.position);updateSky(0.42,false);Sfx.music(dt,false);}
  renderer.render(World.scene,camera);}
boot();
